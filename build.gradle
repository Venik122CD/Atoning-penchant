plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.78"
}

version = project.mod_version
group = "com.atoningpenchant"

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    maven { url = "https://maven.teamabnormals.com/" }
    maven { url = "https://www.cursemaven.com" }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.mc_version
        mappingsVersion = project.parchment_mappings
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        atoning_penchant {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Compile against Caverns & Chasms without bundling it into this mod.
    compileOnly "curse.maven:caverns-and-chasms-438005:8891838"
    compileOnly "com.teamabnormals:blueprint:${project.mc_version}-${project.blueprint}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id     : project.mod_id,
            mod_name   : project.mod_name,
            mod_version: project.mod_version,
            mod_license: project.mod_license,
            mod_authors: project.mod_authors,
            mc_version : project.mc_version,
            cc_min_version: project.cc_min_version
    ]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
